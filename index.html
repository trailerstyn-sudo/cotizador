*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,"Segoe UI",Arial,sans-serif}
header{background:var(--top);color:var(--topt);padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--acc)}
header img{height:48px;width:auto;display:block}header .ht{font-weight:800;letter-spacing:.06em}header .hs{font-size:13px;opacity:.75}
.wrap{max-width:1180px;margin:0 auto;padding:14px}

.box{background:var(--card);border:2px solid var(--line);padding:10px}

label.f{display:flex;gap:6px;align-items:center;font-weight:700}

.c{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:4px 12px;font-size:14px;min-height:30px}
.c.on{background:var(--sel);color:var(--selt);font-weight:700}
.c:focus-visible,.b:focus-visible,.sm:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ot{width:150px}.otn{width:90px}
.sp{font-size:12px;border:1px solid var(--line);background:none;border-radius:12px;padding:0 9px;margin-left:8px;color:var(--mut);opacity:.85}
.vl{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;width:100%;padding:3px 0}.vl+.vl{border-top:1px dashed var(--line)}
.vq{width:62px}.vx{font-weight:700}.sm{font-size:12px;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:2px 10px}
.aq{display:inline-flex;align-items:center;gap:3px;margin-right:6px;font-weight:700}.aq input{width:56px}
.warn{color:var(--warn);font-size:12px;font-weight:700}.mut{color:var(--mut);font-size:12px}
.lista{background:var(--card);border:2px solid var(--line);padding:10px;overflow-x:auto}
.lista td.r,.lista th.r{text-align:right;white-space:nowrap}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.b{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:8px 13px;font-weight:600}.b.p{background:var(--sel);color:var(--selt)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
footer{font-size:12px;color:var(--mut);text-align:center;padding:24px 16px}

async function pdfBytes(R,url){const enc=new TextEncoder(),parts=[],offs=[];let len=0;const add=b=>{if(typeof b==="string")b=enc.encode(b);parts.push(b);len+=b.length};
