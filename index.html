<style>
:root{--bg:#e4e7ea;--card:#fff;--ink:#1b1f23;--mut:#5b6670;--line:#c3cad1;--line2:#2b3138;--acc:#2f7fc1;--sel:#1f2a36;--selt:#fff;--chip:#eef0f2;--warn:#b3261e;--top:#141a21;--topt:#fff;--grn:#8cc63f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--card:#22272c;--ink:#eceff1;--mut:#9aa5ae;--line:#3b444c;--line2:#6b7681;--acc:#5aa5e0;--sel:#e8edf1;--selt:#15181b;--chip:#2d343a;--warn:#ff8a80;--top:#0d1116;--topt:#fff}}
:root[data-theme="dark"]{--bg:#15181b;--card:#22272c;--ink:#eceff1;--mut:#9aa5ae;--line:#3b444c;--line2:#6b7681;--acc:#5aa5e0;--sel:#e8edf1;--selt:#15181b;--chip:#2d343a;--warn:#ff8a80;--top:#0d1116;--topt:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
header{background:var(--top);color:var(--topt);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--acc)}
header img{height:52px;width:auto;display:block}
header .ht{font-weight:800;letter-spacing:.06em;font-size:18px}header .hs{font-size:13px;opacity:.75}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line2);border-radius:6px;overflow:hidden}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
tr:last-child>td{border-bottom:none}
td.l{width:1%;white-space:nowrap;font-weight:700;font-size:13px;letter-spacing:.03em;background:var(--chip);border-right:1px solid var(--line)}
.g{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 0}.g+.g{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.gl{font-size:12px;color:var(--mut);font-weight:700;min-width:52px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.c{border:1px solid var(--line2);background:var(--chip);border-radius:16px;padding:5px 13px;font-size:14px;min-height:34px}
.c.on{background:var(--sel);color:var(--selt);font-weight:700;border-color:var(--sel)}
.c:focus-visible,.b:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:6px 8px;min-width:0}
.ot{width:220px;max-width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px}
.row label{display:flex;gap:6px;align-items:center;font-weight:700}
.q th{background:var(--chip);font-size:13px}.q td.r,.q th.r{text-align:right;white-space:nowrap}
.q td small{color:var(--mut)}.q tr.tot td{font-weight:800;background:var(--chip);border-top:2px solid var(--line2)}
.q tr.big td{font-size:19px}.pend{color:var(--warn);font-weight:700}
.empty{padding:18px;color:var(--mut)}
.qbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 10px}.qbar label{font-weight:700;display:flex;gap:8px;align-items:center}.mut2{font-size:13px;color:var(--mut)}
.ds{font-size:12px;border:1px solid var(--line2);background:none;border-radius:12px;padding:1px 9px;margin-left:8px;color:var(--mut);font-weight:600}
.vl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 0}.vl+.vl{border-top:1px dashed var(--line)}
.vq{width:62px}.aq{display:inline-flex;align-items:center;gap:4px;font-weight:800;margin-right:6px}.aq .vq{width:56px}.vx{font-weight:800}.sm{font-size:12px;border:1px solid var(--line2);background:var(--chip);border-radius:12px;padding:3px 10px}.warn{color:var(--warn);font-size:12px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.b{border:1px solid var(--line2);background:var(--chip);border-radius:6px;padding:9px 14px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block}
.b.p{background:var(--sel);color:var(--selt)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
footer{font-size:12px;color:var(--mut);text-align:center;padding:24px 16px}
.ph{display:none}
@media(max-width:640px){td.l{display:block;width:auto;border-right:none;border-bottom:none;padding-bottom:2px;background:none;color:var(--mut)}tr.rb>td{display:block;border-bottom:none}tr.rb{display:block;border-bottom:1px solid var(--line)}.ds{margin-left:6px}header img{height:42px}}

function warnV(){document.querySelectorAll("span.warn[data-row]").forEach(w=>{const s=(V[w.dataset.row]||[]).reduce((a,v)=>a+(parseInt(v.q)||0),0);w.textContent=s===NT?"":"Suman "+s+" de "+NT})}
function lineRow(L){const rs=[...new Set([...L.sk,...L.mk].map(rowOf).filter(Boolean))];return rs.length===1?rs[0]:null}
function lineVal(L,st){
 for(const k of [...L.sk,...L.mk])if(sel(k,st).includes("OTRO")||sel(k,st).some(n=>nc(k,n)))return null;
 const key=L.sk.map(k=>has(k,st)?sel(k,st)[0]:"").join("|");let v=L.v[key];if(v==null)return 0;
 let base=Array.isArray(v)?v[0]:v;const d=Array.isArray(v)?v[1]:{};
 L.mk.forEach(k=>{if(has(k,st))sel(k,st).forEach(n=>{base+=(d[k]&&d[k][n])||0})});return base}
function desc(keys,st){return keys.map(k=>{const r=R(k);if(!r||!sel(k,st).length||sel(k,st).includes("NO VA"))return"";return(r.t&&r.t!=="Material"?r.t+" ":"")+sel(k,st).map(x=>x==="OTRO"?(st.ot[k]||"otro"):x).join(", ")}).filter(Boolean).join(" · ")}
function calc(){const G=new Map();
 T.lines.forEach(L=>{const row=lineRow(L),sts=states(row);sts.forEach((x,vi)=>{if(!(x.q>0))return;const id=L.n+"|"+L.acc+(x.vr?"|"+row+"|"+vi:"");let g=G.get(id);if(!g){g={n:L.n,acc:L.acc,v:0,pend:false,keys:[],q:x.q,st:x.st};G.set(id,g)}
  [...L.sk,...L.mk].forEach(k=>{if(!g.keys.includes(k))g.keys.push(k)});const u=lineVal(L,x.st);if(u===null)g.pend=true;else if(u>0.004)g.v+=u*x.q})});
 const all=[...G.values()],base=all.filter(g=>!g.acc&&(g.v>0||g.pend)),acc=all.filter(g=>g.acc&&(g.v>0||g.pend));
 ACC.forEach(i=>{const a=T.acc[i],aq=AQ[i]!=null?AQ[i]:1;if(aq>0)acc.push({n:a.n,v:a.p*NT*aq,pend:!(a.p>0),keys:[],q:NT*aq,st:BASE})});
 const sum=a=>a.reduce((s,g)=>s+(g.pend&&!(g.v>0)?0:g.v),0),lab=g=>(g.q!==1||NT>1?g.q+" × ":"")+g.n;
 const row=g=>{const d=desc(g.keys,g.st);return`<tr><td><b>${E(lab(g))}</b>${d?`<br><small>${E(d)}</small>`:""}</td><td class="r">${g.pend&&!(g.v>0)?'<span class="pend">A confirmar</span>':M(g.v)+(g.pend?'<br><small class="pend">+ ítem a confirmar</small>':"")}</td></tr>`};
 const res=$("res");
 if(!base.length&&!acc.length){res.innerHTML='<div class="empty">Elegí las opciones de arriba y el presupuesto se arma solo.</div>';$("nt").textContent="";window.__txt=null;return}
 let t=`<table class="q"><tr><th>Detalle</th><th class="r">Precio</th></tr>`+base.map(row).join("");
 if(base.length&&acc.length)t+=`<tr class="tot"><td>TOTAL TRAILER${NT>1?"S":""}</td><td class="r">${M(sum(base))}</td></tr>`;
 t+=acc.map(row).join("");
 const tot=sum(base)+sum(acc);
 t+=`<tr class="tot big"><td>TOTAL${NT>1?" ("+NT+" trailers)":""}</td><td class="r">${M(tot)}</td></tr>`;
 res.innerHTML=t+"</table>";
 const pend=[...base,...acc].some(g=>g.pend);
 $("nt").textContent=(T.respaldo?"(Sin conexión a la lista de precios: se muestran precios guardados) ":"")+(T.ivaTxt||"")+(T.fecha?" · Precios vigentes al "+T.fecha:"")+". Presupuesto orientativo, sujeto a confirmación."+(pend?" Los ítems “a confirmar” no están incluidos en el total.":"");
 $("ph").innerHTML=`<b>${E($("cli").value||"")}</b>${$("loc").value?" · "+E($("loc").value):""} · ${new Date().toLocaleDateString("es-AR")}`;
 window.__txt=()=>{const L=[...base,...acc].map(g=>{const d=desc(g.keys,g.st);return"• "+lab(g)+(d?" ("+d+")":"")+": "+(g.pend&&!(g.v>0)?"a confirmar":M(g.v))});return "Hola TYN, quiero consultar este presupuesto"+($("cli").value?" — "+$("cli").value:"")+($("loc").value?" ("+$("loc").value+")":"")+":\n"+L.join("\n")+"\nTOTAL"+(NT>1?" ("+NT+" trailers)":"")+": "+M(tot)}}
$("cant").oninput=()=>{const v=parseInt($("cant").value);if(v>0){const was=NT;NT=v;if((was>1)!==(NT>1)||ACC.length)draw();else{warnV();calc()}}};
$("cli").oninput=calc;$("loc").oninput=calc;
$("pr").onclick=()=>{try{window.print()}catch(e){}};
$("rs").onclick=()=>{BASE.s={};BASE.ot={};for(const k in V)delete V[k];for(const k in AQ)delete AQ[k];ACC=[];NT=1;$("cant").value=1;draw();scrollTo(0,0)};
$("wa").onclick=()=>{const t=window.__txt?window.__txt():"Hola TYN, quiero consultar por un trailer";const u="https://wa.me/"+(T.wa||"")+"?text="+encodeURIComponent(t);try{window.open(u,"_blank","noopener")}catch(e){location.href=u}};
if(!T.wa)$("wa").style.display="none";
$("ft").textContent="TYN Trailers"+(T.dir?" · "+T.dir:"");
draw();
});
</script>
